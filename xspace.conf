# xspace/xspace.conf — private tenant config for xcorekit/xcore
# Extracted public tools now live in their own repos under xcorekit org.
# This file configures only what remains private.
# ─────────────────────────────────────────────────────────────────────────────

# Orchestrator
CONFIGURE_DIR="_configure"

# Private spaces
BACKUPSPACE_DIR="backup-space"
SYSSPACE_DIR="sys-space"

# Private space bin directories
declare -a XSPACE_ALL_BIN_DIRS=(
    "_configure/bin"
    "backup-space/bin"
    "sys-space/bin"
)

# backup-space paths
BACKUPSPACE_CONFIG_DIR="backup-space/config"
BACKUPSPACE_LOG_DIR="backup-space/logs"
BACKUPSPACE_CONF="backup-space/config/backups.conf"

# User bin
USER_BIN_DEFAULT="$HOME/bin"
